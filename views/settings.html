<!-- settings.html -->
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>설정</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #1a1b26;
      color: #c0caf5;
      padding: 20px;
      margin: 0;
    }
    h2 {
      margin-bottom: 20px;
      color: #7aa2f7;
    }
    label {
      display: block;
      margin-top: 12px;
    }
    input[type="text"],
    input[type="password"] {
      width: calc(100% - 10px);
      padding: 6px;
      background-color: #1a1b26;
      color: #c0caf5;
      border: 1px solid #3b4261;
      margin-top: 4px;
    }
    button {
      margin-top: 12px;
      background-color: #7aa2f7;
      color: #1a1b26;
      border: none;
      padding: 8px 12px;
      font-weight: bold;
      cursor: pointer;
      border-radius: 4px;
    }
    button:hover {
      background-color: #9ece6a;
    }
    .path-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .path-row input {
      flex: 1;
    }  
  </style>
</head>
<body>
  <form id="settingsForm">
    <h2>설정</h2>
    <label>부서명:
      <input type="text" id="departmentName"/>
    </label>

    <label>
      출력 폴더 경로
      <div>
        <input type="text" id="outputPath" readonly />
        <button type="button" id="browseBtn">탐색</button>
      </div>
    </label>

    <label>근태 동기화 주소:
      <input type="text" id="attendanceIntegrationUrl" placeholder="127.0.0.1:3000" />
    </label>

    <label>API 연동키:
      <input type="password" id="attendanceIntegrationKey" placeholder="local-integration-key" />
    </label>
    <br>

    <button type="submit">저장</button>
  </form>
  <script src="../src/settings.js"></script>
</body>
</html>
